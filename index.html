  <style>
:root {
      --gutter: clamp(20px, 5vw, 64px);
      --ink-black: #FFFFFF;
      --navy-deep: #F4EFE6;
      --panel: #F7F3EA99;
      --panel-2: #F1ECE1;
      --cream: #14181C;
      --cream-dim: rgba(20,24,28,0.72);
      --muted: rgba(20,24,28,0.5);
      --gold: #8A6D2E;
      --cobalt: #2C53C9;
      --hair: rgba(20,24,28,0.12);
      --hair-strong: rgba(20,24,28,0.28);
      --ink: var(--cream);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--ink-black);
      color: var(--cream);
      font-family: var(--font-sans, 'Jost', system-ui, sans-serif);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    img { max-width: 100%; }
    ::selection { background: var(--cobalt); color: #fff; }

    .feiri-marquee { animation: feiri-scroll 38s linear infinite; }
    @keyframes feiri-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    .feiri-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
    .feiri-btn:active { transform: translateY(1px); }

    .feiri-btn.feiri-cta-3d {
      box-shadow: 0 4px 0 #C9A24B, 0 14px 28px rgba(0,0,0,0.32);
      transition: transform .15s ease, box-shadow .15s ease, filter .2s ease;
    }
    .feiri-btn.feiri-cta-3d:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 #C9A24B, 0 20px 34px rgba(0,0,0,0.38);
    }
    .feiri-btn.feiri-cta-3d:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #C9A24B, 0 8px 16px rgba(0,0,0,0.28);
    }
    a { transition: color .2s ease; }
    .feiri-nav a:hover { color: var(--cream); }

    @media (max-width: 900px) {
      .feiri-2col { grid-template-columns: 1fr !important; }
    }

    .feiri-owners-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
      align-items: start;
    }
    .feiri-owners-grid > :nth-child(even) { margin-top: 40px; }
    .feiri-owner-card img { will-change: transform; }
    .feiri-owner-card:hover { transform: translateY(-4px); box-shadow: 0 26px 60px rgba(0,0,0,0.55) !important; }
    .feiri-owner-card:hover img { transform: scale(1.05); }
    .feiri-owner-card { transition: transform .3s ease, box-shadow .3s ease; }
    .feiri-reveal { opacity: 0; scale: 0.96; translate: 0 28px; transition: opacity 2s cubic-bezier(.2,.7,.2,1), scale 2s cubic-bezier(.2,.7,.2,1), translate 2s cubic-bezier(.2,.7,.2,1); }
    .feiri-reveal.is-revealed { opacity: 1; scale: 1; translate: 0 0; }
    @media (max-width: 860px) {
      .feiri-owners-grid { grid-template-columns: repeat(3, 1fr); }
      .feiri-owners-grid > :nth-child(even) { margin-top: 0; }
      .feiri-owners-grid > :nth-child(3n-1) { margin-top: 32px; }
    }
    @media (max-width: 520px) {
      .feiri-owners-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .feiri-owners-grid > :nth-child(n) { margin-top: 0; }
      .feiri-owners-grid > :nth-child(even) { margin-top: 26px; }
      .feiri-br { display: none; }
    }
    @media (max-width: 720px) {
      .feiri-nav { display: none !important; }
      header [style*="grid-template-columns: 1fr auto 1fr"] { grid-template-columns: auto 1fr !important; }
      .feiri-hero-section { min-height: 78vh !important; }
      .feiri-hero-copy { top: auto !important; bottom: 150px !important; left: var(--gutter) !important; right: var(--gutter) !important; max-width: none !important; text-align: center !important; }
      .feiri-hero-heading { color: #FAF0D6 !important; }
      .feiri-hero-sub { color: rgba(250,240,214,0.85) !important; }
      .feiri-hero-scrim-bottom { background: linear-gradient(0deg, rgba(6,18,26,0.9) 0%, rgba(6,18,26,0.55) 50%, rgba(6,18,26,0) 78%) !important; }
      .feiri-hero-actions { display: flex; flex-direction: column; align-items: center; }
      .feiri-hero-cta-row { justify-content: center; }
      .feiri-hero-rating { align-items: center; text-align: center; }
      .feiri-hero-img { object-position: 35% 25% !important; }
    }
    /* Compare table: the 130px tick columns starve the label column on a phone.
       Shrink the ticks instead of shrinking the text below 16px. */
    @media (max-width: 620px) {
      .feiri-compare-head,
      .feiri-compare-head ~ div { grid-template-columns: 1fr 66px 66px !important; }
      .feiri-compare-head > div { padding-left: 4px !important; padding-right: 4px !important; }
      .feiri-compare-head > div span { letter-spacing: 0.04em !important; }
      .feiri-compare-head ~ div > div:first-child { padding: 16px 12px 16px 14px !important; }
      .feiri-compare-head ~ div > div:not(:first-child) { padding-left: 4px !important; padding-right: 4px !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feiri-marquee { animation: none; }
      html { scroll-behavior: auto; }
      .feiri-reveal { opacity: 1; scale: 1; translate: 0 0; transition: none; }
    }

    /* --- The Standard: the sized-up polo, with its failures labelled ---
       The plate is 1254px square. Capping the rendered width at 620px keeps the
       file at or just above 1.0x device-pixel coverage at every width, which is the
       target: 600 CSS px at DPR2 needs 1200 device px and the file is 1206, and 350 CSS px
       at DPR3 needs 1050. Without the cap the figure runs full-bleed to 920px in the
       single-column band, where 1206px would be genuinely soft. The cap is the fix, not an
       upscale: the master is 1206 against a declared 1600 floor, and the floor is a proxy
       for sharpness that this beats on the metric it stands in for. */
    .feiri-problem { max-width: 600px; margin-inline: auto; }
    .feiri-problem-frame { position: relative; aspect-ratio: 1 / 1; border-radius: 14px;
      overflow: hidden; background: #EDE7DC; box-shadow: 0 30px 80px rgba(0,0,0,0.28); }
    .feiri-problem-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .feiri-problem-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .feiri-problem-label { position: absolute; transform: translateY(-50%);
      font-family: var(--font-sans); font-size: clamp(11px, 1.4vw, 13px); font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase; line-height: 1.35;
      color: #7C6128; max-width: 20.5%; pointer-events: none; }
    .feiri-problem-label.is-left  { transform: translate(-100%, -50%); text-align: right; }
    .feiri-problem .is-narrow { display: none; }

    /* Below 760px the labels stay ON the photograph, in the empty backdrop: top-left,
       top-right and mid-left. They are HTML, so at 350px they set at 11px and stay
       readable, where type baked into the JPEG would have rendered near 6px. */
    @media (max-width: 759px) {
      .feiri-problem .is-wide { display: none; }
      .feiri-problem .is-narrow { display: block; }
      .feiri-problem-label.is-narrow { font-size: 11px; letter-spacing: 0.06em; max-width: 27%; line-height: 1.3; }
    }

    /* --- The Lookbook --- */
    .lb-masthead { max-width: 640px; margin-bottom: clamp(40px, 5vw, 64px); }
    .lb-meta { display: flex; align-items: center; gap: 18px; margin-top: 28px; }
    .lb-rule { flex: 1; height: 1px; background: var(--hair); }
    .feiri-lookbook { display: flex; flex-direction: column; gap: clamp(30px, 4.5vw, 64px); }
    .lb-chapter { display: flex; align-items: center; gap: 18px; padding: 4px 0; }
    .lb-row-duo { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.2vw, 28px); }
    .lb-row-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(16px, 2.2vw, 28px); }
    .lb-row-feat { display: grid; grid-template-columns: 1.14fr 0.86fr; gap: clamp(16px, 2.2vw, 28px); align-items: start; }
    .lb-row-feat--rev { grid-template-columns: 0.86fr 1.14fr; }
    .lb-stack { display: flex; flex-direction: column; gap: clamp(16px, 2.2vw, 28px); }
    .lb-fig { margin: 0; display: flex; flex-direction: column; }
    .lb-frame { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--hair); background: #000; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
    .lb-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transition: transform .9s cubic-bezier(.2,.7,.2,1); }
    .lb-fig:hover .lb-frame img { transform: scale(1.045); }
    .lb-cap { display: flex; align-items: baseline; gap: 13px; padding: 13px 3px 0; }
    .lb-idx { letter-spacing: 0.02em; }
    .lb-place { letter-spacing: 0.01em; }
    .lb-tag { margin-left: auto; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; }
    .lb-close { margin-top: clamp(40px, 5vw, 64px); padding-top: 24px; border-top: 1px solid var(--hair); text-align: center; }
    @media (max-width: 820px) {
      .lb-row-feat, .lb-row-feat--rev { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .lb-row-duo, .lb-row-trio { grid-template-columns: 1fr; }
    }

    /* --- v2 hero: stacked on mobile so copy never covers the garment --- */
    .feiri-hero-media { position: absolute; inset: 0; }
    @media (max-width: 720px) {
      .feiri-hero-section { display: block !important; min-height: 0 !important; }
      .feiri-hero-media { position: relative; height: 58vh; background: #fff; }
      .feiri-hero-img { object-position: 50% 10% !important; }
      .feiri-hero-scrim-bottom { display: none !important; }
      .feiri-hero-copy {
        position: static !important; inset: auto !important; max-width: none !important;
        text-align: left !important; background: var(--navy-deep);
        padding: 26px var(--gutter) 0 !important;
      }
      .feiri-hero-heading { font-size: 2rem !important; line-height: 1.15 !important; color: var(--cream) !important; }
      .feiri-hero-sub { color: var(--cream-dim) !important; font-size: 16px !important; }
      .feiri-hero-section > div:last-child { background: var(--navy-deep); padding: 18px var(--gutter) 34px !important; }
      .feiri-hero-actions { display: block !important; }
      .feiri-hero-cta-row { justify-content: stretch !important; }
      .feiri-hero-cta-row .feiri-btn { width: 100% !important; }
      .feiri-hero-actions > p { text-align: left !important; margin-left: 0 !important; }
    }

    /* --- v2 hero: two columns on desktop, portrait image needs its own column --- */
    @media (min-width: 721px) {
      .feiri-hero-section { display: grid !important; grid-template-columns: 1.02fr 0.98fr; min-height: 92vh; background: var(--navy-deep) !important; }
      .feiri-hero-media { position: relative !important; inset: auto !important; grid-column: 1; grid-row: 1 / span 2; align-self: stretch; height: 92vh; background: #fff; }
      .feiri-hero-img { object-position: 50% 12% !important; }
      .feiri-hero-scrim-bottom { display: none !important; }
      .feiri-hero-copy {
        position: static !important; inset: auto !important; grid-column: 2; grid-row: 1;
        align-self: end; max-width: 560px !important; text-align: left !important;
        padding: 0 clamp(28px,4vw,64px) !important;
      }
      .feiri-hero-heading { color: var(--cream) !important; font-size: clamp(2.2rem,3.2vw,3.4rem) !important; line-height: 1.1 !important; }
      .feiri-hero-sub { color: var(--cream-dim) !important; }
      .feiri-hero-section > div:last-child {
        grid-column: 2; grid-row: 2; align-self: start; max-width: 560px !important;
        margin: 0 !important; padding: 24px clamp(28px,4vw,64px) 0 !important;
      }
      .feiri-hero-section > div:last-child > div { max-width: none !important; margin: 0 !important; }
      .feiri-hero-actions { display: block !important; }
      .feiri-hero-cta-row { justify-content: flex-start !important; }
      .feiri-hero-actions > p { text-align: left !important; margin-left: 0 !important; }
    }
    .feiri-hero-cta-row .feiri-cta-3d { box-shadow: 0 10px 26px rgba(20,24,28,0.20) !important; }
    .feiri-hero-cta-row .feiri-cta-3d:hover { box-shadow: 0 14px 32px rgba(20,24,28,0.26) !important; }
    .feiri-hero-cta-row .feiri-cta-3d:active { box-shadow: 0 5px 14px rgba(20,24,28,0.18) !important; }

    /* --- Floating WhatsApp button --- */
    .feiri-wa-fab {
      position: fixed; right: 16px; bottom: 16px; z-index: 60;
      width: 54px; height: 54px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #25D366; text-decoration: none;
      box-shadow: 0 8px 24px rgba(20,24,28,0.28);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease, visibility .18s ease;
    }
    .feiri-wa-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(20,24,28,0.34); }
    .feiri-wa-fab:active { transform: translateY(0); box-shadow: 0 5px 14px rgba(20,24,28,0.24); }
    .feiri-wa-fab:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    /* Stood down over the hero and the buy block. visibility also takes it out of
       the tab order; pointer-events takes it out of hit-testing. */
    .feiri-wa-fab.is-hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
      transform: translateY(10px) scale(0.92);
    }
    @media (min-width: 721px) {
      .feiri-wa-fab { right: 22px; bottom: 22px; width: 58px; height: 58px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feiri-wa-fab { transition: none; }
      .feiri-wa-fab:hover, .feiri-wa-fab:active { transform: none; }
    }
    /* Lifted clear of the sticky buy bar when that bar is up. Both appear under the
       same condition, so without this the FAB sits on top of the buy button — the
       exact collision QC measured on 2026-08-24, where a thumb on the right of the
       CTA opened WhatsApp instead. */
    .feiri-wa-fab.is-raised { bottom: calc(var(--feiri-sticky-h, 74px) + 14px); }
    @media (min-width: 721px) {
      .feiri-wa-fab.is-raised { bottom: calc(var(--feiri-sticky-h, 74px) + 20px); }
    }

    /* --- Hero: the photograph is tappable ---
       Fills the media box and carries no z-index on purpose. .feiri-hero-copy and the
       CTA block are later siblings of .feiri-hero-media and are positioned, so DOM
       order keeps them above this. Adding a z-index here would steal taps from the
       "See how it fits" button. */
    /* The hero image is a swipeable strip. It fills the media box, which is its own
       grid column above 721px and its own 58vh band below it, so it is nowhere near
       the CTA and cannot eat a tap meant for "See how it fits". */
    .feiri-hero-strip {
      position: absolute; inset: 0;
      display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; -ms-overflow-style: none;
      overscroll-behavior-x: contain;
    }
    .feiri-hero-strip::-webkit-scrollbar { display: none; }
    .feiri-hero-slide {
      flex: 0 0 100%; scroll-snap-align: center; scroll-snap-stop: always;
      display: block; height: 100%; width: 100%;
      padding: 0; margin: 0; border: 0; background: #fff;
      cursor: zoom-in; -webkit-tap-highlight-color: transparent;
    }
    .feiri-hero-slide:focus-visible { outline: 3px solid var(--gold); outline-offset: -6px; }
    .feiri-hero-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Dots sit over the photograph's own ground, which is a white studio wall on every
       frame, so they are ink rather than cream. pointer-events:none or they swallow a
       swipe that starts on them. */
    /* Caption, dots and pill in one bar so they cannot collide. The whole bar is
       pointer-events:none: anything here that accepted a pointer would swallow a swipe
       that started on it. */
    .feiri-hero-bar {
      position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none;
      display: flex; align-items: flex-end; justify-content: space-between; gap: 14px;
      padding: 40px 14px 12px;
      background: linear-gradient(0deg, rgba(250,248,242,0.97) 18%, rgba(250,248,242,0.82) 52%, rgba(250,248,242,0) 100%);
    }
    .feiri-hero-bar.is-bare { background: none; padding-top: 12px; }
    .feiri-hero-caption {
      margin: 0; max-width: 74%;
      font-family: var(--font-sans); font-size: 16px; line-height: 1.4;
      color: var(--cream); font-weight: 500;
    }
    .feiri-hero-dots {
      display: flex; gap: 7px; flex: 0 0 auto; padding-bottom: 4px;
    }
    .feiri-hero-dot {
      width: 7px; height: 7px; border-radius: 999px;
      background: rgba(20,24,28,0.28); transition: background .2s ease, transform .2s ease;
    }
    .feiri-hero-dot.is-on { background: rgba(20,24,28,0.88); transform: scale(1.15); }
    @media (min-width: 721px) {
      .feiri-hero-bar { padding: 56px 22px 20px; }
      .feiri-hero-caption { font-size: 18px; max-width: 72%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .feiri-hero-strip { scroll-behavior: auto; }
      .feiri-hero-dot { transition: none; }
      .feiri-hero-dot.is-on { transform: none; }
    }

    /* The size slide. Rendered, not a picture of a table: five columns baked into a
       JPEG and scaled into a 390px slot is unreadable, and this is the one thing the
       fit-anxious buyer needs most. Styled to sit with the lander, not against it. */
    .feiri-hero-sizecard {
      background: var(--panel-2); cursor: default;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 16px;
    }
    .feiri-hero-sizecard-inner { width: 100%; max-width: 560px; }
    .feiri-hero-sizecard-eyebrow {
      margin: 0 0 8px; font-family: var(--font-sans); font-size: 12px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold);
    }
    .feiri-hero-sizecard-head {
      margin: 0 0 10px; font-family: var(--font-serif); font-variant: small-caps;
      font-weight: 600; letter-spacing: 0.02em; line-height: 1.1; color: var(--cream);
      font-size: clamp(1.35rem, 3.4vw, 2rem);
    }
    .feiri-hero-sizecard-lede {
      margin: 0 0 16px; font-family: var(--font-sans); font-size: 16px; line-height: 1.5;
      color: var(--cream-dim);
    }
    .feiri-hero-sizetable { width: 100%; border-collapse: collapse; }
    .feiri-hero-sizetable th, .feiri-hero-sizetable td {
      font-family: var(--font-sans); font-size: 16px; text-align: right;
      padding: 9px 6px; border-bottom: 1px solid var(--hair); color: var(--cream);
    }
    /* 16px on the size headers, not smaller. The store's own size table had exactly
       this defect and it was fixed on 2026-08-20, 12px to 16px. The size a man reads
       off is not decoration. */
    .feiri-hero-sizetable thead th {
      font-size: 16px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--gold); border-bottom: 1px solid var(--hair-strong);
    }
    .feiri-hero-sizetable th[scope="row"], .feiri-hero-sizetable thead th:first-child {
      text-align: left; font-weight: 500; color: var(--cream-dim);

    .feiri-hero-sizetable tbody tr:last-child th,
