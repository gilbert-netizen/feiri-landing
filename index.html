  <style>
:root {

    * { box-sizing: border-box; }

    .feiri-btn.feiri-cta-3d {

    .feiri-btn.feiri-cta-3d:hover {

    }
    .feiri-btn.feiri-cta-3d:active {

    }
    a { transition: color .2s ease; }
    .feiri-nav a:hover { color: var(--cream); }

    @media (max-width: 900px) {

    .feiri-owners-grid {

    .feiri-owner-card { transition: transform .3s ease, box-shadow .3s ease; }
    .feiri-reveal { opacity: 0; scale: 0.96; translate: 0 28px; transition: opacity 2s cubic-bezier(.2,.7,.2,1), scale 2s cubic-bezier(.2,.7,.2,1), translate 2s cubic-bezier(.2,.7,.2,1); }
    .feiri-reveal.is-revealed { opacity: 1; scale: 1; translate: 0 0; }
    @media (max-width: 860px) {

    /* Compare table: the 130px tick columns starve the label column on a phone.

      .feiri-compare-head > div { padding-left: 4px !important; padding-right: 4px !important; }

    /* --- The Standard: the sized-up polo, with its failures labelled ---
       The plate is 1254px square. Capping the rendered width at 620px keeps the
       file at or just above 1.0x device-pixel coverage at every width, which is the
       target: 600 CSS px at DPR2 needs 1200 device px and the file is 1206, and 350 CSS px
       at DPR3 needs 1050. Without the cap the figure runs full-bleed to 920px in the
       single-column band, where 1206px would be genuinely soft. The cap is the fix, not an
       upscale: the master is 1206 against a declared 1600 floor, and the floor is a proxy
       for sharpness that this beats on the metric it stands in for. */
    .feiri-problem { max-width: 600px; margin-inline: auto; }
    .feiri-problem-frame { position: relative; aspect-ratio: 1 / 1; border-radius: 14px;
      overflow: hidden; background: #EDE7DC; box-shadow: 0 30px 80px rgba(0,0,0,0.28); }
    .feiri-problem-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .feiri-problem-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .feiri-problem-label { position: absolute; transform: translateY(-50%);
      font-family: var(--font-sans); font-size: clamp(11px, 1.4vw, 13px); font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase; line-height: 1.35;
      color: #7C6128; max-width: 20.5%; pointer-events: none; }
    .feiri-problem-label.is-left  { transform: translate(-100%, -50%); text-align: right; }
    .feiri-problem-num { position: absolute; display: none; transform: translate(-50%, -50%);
      width: 22px; height: 22px; border-radius: 999px; background: #82662B; color: #FFF;
      font-family: var(--font-sans); font-size: 12px; font-weight: 700;
      align-items: center; justify-content: center; line-height: 1; }
    .feiri-problem-list { display: none; }

    /* Below 760px there is no room to anchor a label beside the figure: the frame is
       350px wide at 390px, so the two right-hand labels would sit on the man. The dots
       carry numbers instead and the words move underneath, full size and readable. */
    @media (max-width: 759px) {
      .feiri-problem-lines, .feiri-problem-label { display: none; }
      .feiri-problem-num { display: inline-flex; }
      .feiri-problem-list { display: block; list-style: none; margin: 20px 0 0; padding: 0; }
      .feiri-problem-list li { display: flex; align-items: flex-start; gap: 10px;
        font-family: var(--font-sans); font-size: 16px; line-height: 1.45;
        color: var(--cream-dim); padding: 7px 0; }
      .feiri-problem-list li span { flex: 0 0 auto; width: 22px; height: 22px; border-radius: 999px;
        background: #82662B; color: #FFF; font-size: 12px; font-weight: 700;
        display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
    }

    /* --- The Lookbook --- */
    .lb-masthead { max-width: 640px; margin-bottom: clamp(40px, 5vw, 64px); }
    .lb-meta { display: flex; align-items: center; gap: 18px; margin-top: 28px; }
    .lb-rule { flex: 1; height: 1px; background: var(--hair); }
    .feiri-lookbook { display: flex; flex-direction: column; gap: clamp(30px, 4.5vw, 64px); }
    .lb-chapter { display: flex; align-items: center; gap: 18px; padding: 4px 0; }
    .lb-row-duo { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(16px, 2.2vw, 28px); }
    .lb-row-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(16px, 2.2vw, 28px); }
    .lb-row-feat { display: grid; grid-template-columns: 1.14fr 0.86fr; gap: clamp(16px, 2.2vw, 28px); align-items: start; }
    .lb-row-feat--rev { grid-template-columns: 0.86fr 1.14fr; }
    .lb-stack { display: flex; flex-direction: column; gap: clamp(16px, 2.2vw, 28px); }
    .lb-fig { margin: 0; display: flex; flex-direction: column; }
    .lb-frame { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--hair); background: #000; box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
    .lb-frame img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; transition: transform .9s cubic-bezier(.2,.7,.2,1); }
    .lb-fig:hover .lb-frame img { transform: scale(1.045); }
    .lb-cap { display: flex; align-items: baseline; gap: 13px; padding: 13px 3px 0; }
    .lb-idx { letter-spacing: 0.02em; }
    .lb-place { letter-spacing: 0.01em; }
    .lb-tag { margin-left: auto; letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; }

    @media (max-width: 820px) {

    @media (max-width: 620px) {

      .feiri-hero-sub { color: var(--cream-dim) !important; font-size: 16px !important; }
      .feiri-hero-section > div:last-child { background: var(--navy-deep); padding: 18px var(--gutter) 34px !important; }

    /* --- v2 hero: two columns on desktop, portrait image needs its own column --- */
    @media (min-width: 721px) {
      .feiri-hero-section { display: grid !important; grid-template-columns: 1.02fr 0.98fr; min-height: 92vh; background: var(--navy-deep) !important; }
      .feiri-hero-media { position: relative !important; inset: auto !important; grid-column: 1; grid-row: 1 / span 2; align-self: stretch; height: 92vh; background: #fff; }
      .feiri-hero-img { object-position: 50% 12% !important; }
      .feiri-hero-scrim-bottom { display: none !important; }
      .feiri-hero-copy {
        position: static !important; inset: auto !important; grid-column: 2; grid-row: 1;
        align-self: end; max-width: 560px !important; text-align: left !important;
        padding: 0 clamp(28px,4vw,64px) !important;

      .feiri-hero-heading { color: var(--cream) !important; font-size: clamp(2.2rem,3.2vw,3.4rem) !important; line-height: 1.1 !important; }
      .feiri-hero-sub { color: var(--cream-dim) !important; }
      .feiri-hero-section > div:last-child {
        grid-column: 2; grid-row: 2; align-self: start; max-width: 560px !important;
        margin: 0 !important; padding: 24px clamp(28px,4vw,64px) 0 !important;
      }
      .feiri-hero-section > div:last-child > div { max-width: none !important; margin: 0 !important; }
      .feiri-hero-actions { display: block !important; }
      .feiri-hero-cta-row { justify-content: flex-start !important; }
      .feiri-hero-actions > p { text-align: left !important; margin-left: 0 !important; }
    }
    .feiri-hero-cta-row .feiri-cta-3d { box-shadow: 0 10px 26px rgba(20,24,28,0.20) !important; }
    .feiri-hero-cta-row .feiri-cta-3d:hover { box-shadow: 0 14px 32px rgba(20,24,28,0.26) !important; }
    .feiri-hero-cta-row .feiri-cta-3d:active { box-shadow: 0 5px 14px rgba(20,24,28,0.18) !important; }

    /* --- Floating WhatsApp button --- */
    .feiri-wa-fab {
      position: fixed; right: 16px; bottom: 16px; z-index: 60;
      width: 54px; height: 54px; border-radius: 999px;
      display: inline-flex; align-items: center; justify-content: center;
      background: #25D366; text-decoration: none;

      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease, visibility .18s ease;

    .feiri-wa-fab:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(20,24,28,0.34); }
    .feiri-wa-fab:active { transform: translateY(0); box-shadow: 0 5px 14px rgba(20,24,28,0.24); }

    /* Stood down over the hero and the buy block. visibility also takes it out of

    }
    @media (min-width: 721px) {

    @media (prefers-reduced-motion: reduce) {
      .feiri-wa-fab { transition: none; }
      .feiri-wa-fab:hover, .feiri-wa-fab:active { transform: none; }
    }
